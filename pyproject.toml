[project]
name = "lion-api"
version = "0.1.0"
description = "API RAG para dúvidas de IRPF com fontes oficiais da RFB (MVP derivado do projeto LION)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
