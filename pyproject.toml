[project]
name = "lion-api"
dynamic = ["version"]
description = "API RAG para dúvidas de IRPF com fontes oficiais da RFB (MVP derivado do projeto LION)"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
